<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 920" width="100%" height="100%" style="background:#07070f; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Cyan & Magenta Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- Background Grid Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#16182c" stroke-width="1"/>
    </pattern>
    <!-- Card Gradients -->
    <linearGradient id="pitchGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#0e2a22" />
      <stop offset="100%" stopColor="#081412" />
    </linearGradient>
    <linearGradient id="flightGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#241438" />
      <stop offset="100%" stopColor="#0e0a1f" />
    </linearGradient>
    <linearGradient id="cyanLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stopColor="#00f0ff" />
      <stop offset="100%" stopColor="#00ff66" />
    </linearGradient>
  </defs>

  <!-- Phone Screen Frame -->
  <rect x="8" y="8" width="434" height="904" rx="38" fill="#07070f" stroke="#1f2342" stroke-width="3" />
  <!-- Cyber Grid Texture -->
  <rect x="12" y="12" width="426" height="896" rx="34" fill="url(#cyberGrid)" />

  <!-- Top Ambient Glow Spots -->
  <circle cx="80" cy="120" r="120" fill="#00f0ff" opacity="0.08" filter="blur(50px)" />
  <circle cx="380" cy="280" r="140" fill="#ff007f" opacity="0.06" filter="blur(60px)" />

  <!-- ================= 1. STATUS & TICKER BAR ================= -->
  <g transform="translate(24, 25)">
    <!-- Top Bar -->
    <g class="flex justify-between">
      <!-- Logo -->
      <g>
        <text x="0" y="24" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="-0.5">KICKOFF <tspan fill="#00f0ff">RIVALS</tspan></text>
        <text x="0" y="38" font-size="10" font-weight="700" fill="#00ff66" letter-spacing="2" font-family="monospace">ESPORTS ARENA</text>
      </g>
      <!-- User Balance Pill -->
      <g transform="translate(260, 4)">
        <rect x="0" y="0" width="142" height="38" rx="19" fill="#121528" stroke="#252b52" stroke-width="1.5" />
        <circle cx="20" cy="19" r="10" fill="#00f0ff" />
        <text x="20" y="23" font-size="11" font-weight="900" fill="#07070f" text-anchor="middle">K</text>
        <text x="78" y="24" font-size="14" font-weight="800" fill="#ffffff" font-family="monospace">12,450</text>
      </g>
    </g>

    <!-- Live Broadcast Ticker -->
    <g transform="translate(0, 52)">
      <rect x="0" y="0" width="402" height="30" rx="8" fill="#0e1122" stroke="#1c213f" stroke-width="1" />
      <circle cx="16" cy="15" r="4" fill="#00ff66" filter="url(#neonGlow)" />
      <text x="28" y="19" font-size="11" font-weight="700" fill="#8b95c9" font-family="monospace">
        LIVE: <tspan fill="#00f0ff">PREMIER R#1042</tspan> • AVIATOR <tspan fill="#f59e0b">52.81X WIN</tspan> • 2.4K PLAYING
      </text>
    </g>
  </g>

  <!-- ================= 2. CATEGORY PILLS ================= -->
  <g transform="translate(24, 125)">
    <!-- Active Pill -->
    <rect x="0" y="0" width="105" height="32" rx="16" fill="#00f0ff" />
    <text x="52" y="20" font-size="12" font-weight="900" fill="#07070f" text-anchor="middle">ALL GAMES</text>

    <!-- Inactive Pills -->
    <rect x="115" y="0" width="85" height="32" rx="16" fill="#121528" stroke="#1f2547" stroke-width="1" />
    <text x="157" y="20" font-size="12" font-weight="700" fill="#8b95c9" text-anchor="middle">⚡ LIVE (2)</text>

    <rect x="210" y="0" width="100" height="32" rx="16" fill="#121528" stroke="#1f2547" stroke-width="1" />
    <text x="260" y="20" font-size="12" font-weight="700" fill="#8b95c9" text-anchor="middle">🧪 IN LABS (7)</text>

    <rect x="320" y="0" width="82" height="32" rx="16" fill="#121528" stroke="#1f2547" stroke-width="1" />
    <text x="361" y="20" font-size="12" font-weight="700" fill="#8b95c9" text-anchor="middle">LEAGUES</text>
  </g>

  <!-- ================= 3. FEATURED LIVE HERO CARD 1: VIRTUAL FOOTBALL PRO ================= -->
  <g transform="translate(24, 172)">
    <!-- Card Container -->
    <rect x="0" y="0" width="402" height="175" rx="20" fill="url(#pitchGrad)" stroke="#00ff66" stroke-width="2" filter="drop-shadow(0 0 15px rgba(0,255,102,0.25))" />
    
    <!-- Neon Corner Accent -->
    <path d="M 0 30 L 0 0 L 30 0" fill="none" stroke="#00ff66" stroke-width="4" />
    <path d="M 372 0 L 402 0 L 402 30" fill="none" stroke="#00ff66" stroke-width="4" />

    <!-- Badges Row -->
    <g transform="translate(16, 16)">
      <rect x="0" y="0" width="85" height="22" rx="6" fill="#00ff66" />
      <text x="42" y="15" font-size="10" font-weight="900" fill="#07070f" text-anchor="middle">● LIVE 24/7</text>

      <rect x="95" y="0" width="115" height="22" rx="6" fill="#121528" stroke="#2a3359" stroke-width="1" />
      <text x="152" y="15" font-size="10" font-weight="700" fill="#a4b3e6" text-anchor="middle">35S ROUND CYCLE</text>
    </g>

    <!-- Card Content -->
    <g transform="translate(16, 52)">
      <text x="0" y="24" font-size="22" font-weight="900" fill="#ffffff" letter-spacing="-0.5">VIRTUAL FOOTBALL PRO</text>
      <text x="0" y="44" font-size="12" font-weight="500" fill="#86efac" max-width="260">
        Continuous 2D tactical pitch telemetry • 1X2 &amp; GG/NoGG
      </text>

      <!-- Odds Mini Strip -->
      <g transform="translate(0, 56)">
        <rect x="0" y="0" width="60" height="26" rx="6" fill="#0b1b16" stroke="#00ff66" stroke-width="1" />
        <text x="30" y="17" font-size="11" font-weight="800" fill="#00ff66" text-anchor="middle">1 • 2.10</text>

        <rect x="66" y="0" width="60" height="26" rx="6" fill="#0b1b16" stroke="#1f382e" stroke-width="1" />
        <text x="96" y="17" font-size="11" font-weight="800" fill="#86efac" text-anchor="middle">X • 3.20</text>

        <rect x="132" y="0" width="60" height="26" rx="6" fill="#0b1b16" stroke="#1f382e" stroke-width="1" />
        <text x="162" y="17" font-size="11" font-weight="800" fill="#86efac" text-anchor="middle">2 • 2.85</text>
      </g>
    </g>

    <!-- Holographic 2D Pitch Sphere Graphic on Right -->
    <g transform="translate(315, 75)">
      <circle cx="0" cy="0" r="42" fill="#00ff66" opacity="0.1" />
      <circle cx="0" cy="0" r="32" fill="none" stroke="#00ff66" stroke-width="2" stroke-dasharray="4 4" />
      <line x1="-32" y1="0" x2="32" y2="0" stroke="#00ff66" stroke-width="1.5" />
      <circle cx="0" cy="0" r="10" fill="none" stroke="#00ff66" stroke-width="1.5" />
      <!-- Soccer ball -->
      <circle cx="8" cy="-6" r="6" fill="#ffffff" />
    </g>

    <!-- Action Launch Button -->
    <g transform="translate(262, 122)">
      <rect x="0" y="0" width="124" height="38" rx="10" fill="#00ff66" />
      <text x="62" y="24" font-size="12" font-weight="900" fill="#07070f" text-anchor="middle">ENTER ARENA →</text>
    </g>
  </g>

  <!-- ================= 4. FEATURED LIVE HERO CARD 2: DAILY AVIATOR ================= -->
  <g transform="translate(24, 362)">
    <!-- Card Container -->
    <rect x="0" y="0" width="402" height="175" rx="20" fill="url(#flightGrad)" stroke="#00f0ff" stroke-width="2" filter="drop-shadow(0 0 15px rgba(0,240,255,0.25))" />

    <!-- Badges Row -->
    <g transform="translate(16, 16)">
      <rect x="0" y="0" width="85" height="22" rx="6" fill="#00f0ff" />
      <text x="42" y="15" font-size="10" font-weight="900" fill="#07070f" text-anchor="middle">● MULTIPLIER</text>

      <rect x="95" y="0" width="115" height="22" rx="6" fill="#1b1638" stroke="#372c6e" stroke-width="1" />
      <text x="152" y="15" font-size="10" font-weight="700" fill="#c4b5fd" text-anchor="middle">PROVABLY FAIR</text>
    </g>

    <!-- Content -->
    <g transform="translate(16, 52)">
      <text x="0" y="24" font-size="22" font-weight="900" fill="#ffffff" letter-spacing="-0.5">THE DAILY AVIATOR</text>
      <text x="0" y="44" font-size="12" font-weight="500" fill="#93c5fd">
        Rocketing curves with instant cashouts up to 100x+
      </text>

      <!-- Multiplier chips -->
      <g transform="translate(0, 56)">
        <rect x="0" y="0" width="55" height="26" rx="6" fill="#1b1238" stroke="#6366f1" stroke-width="1" />
        <text x="27" y="17" font-size="11" font-weight="900" fill="#c4b5fd" text-anchor="middle">1.85x</text>

        <rect x="61" y="0" width="55" height="26" rx="6" fill="#0e2438" stroke="#38bdf8" stroke-width="1" />
        <text x="88" y="17" font-size="11" font-weight="900" fill="#93c5fd" text-anchor="middle">4.50x</text>

        <rect x="122" y="0" width="62" height="26" rx="6" fill="#38280e" stroke="#eab308" stroke-width="1" />
        <text x="153" y="17" font-size="11" font-weight="900" fill="#fef08a" text-anchor="middle">52.8x</text>
      </g>
    </g>

    <!-- Flying Plane Graphic -->
    <g transform="translate(325, 75)">
      <path d="M -40 25 Q -10 20 20 -15" fill="none" stroke="#00f0ff" stroke-width="3" filter="url(#neonGlow)" />
      <!-- Red Aeroplane Silhouette -->
      <ellipse cx="20" cy="-15" rx="16" ry="7" fill="#dc2626" transform="rotate(-25 20 -15)" />
      <polygon points="12,-18 28,-14 22,-8" fill="#ffe600" />
      <circle cx="28" cy="-18" r="4" fill="#00f0ff" />
    </g>

    <!-- Action Launch Button -->
    <g transform="translate(262, 122)">
      <rect x="0" y="0" width="124" height="38" rx="10" fill="#00f0ff" />
      <text x="62" y="24" font-size="12" font-weight="900" fill="#07070f" text-anchor="middle">LAUNCH FLIGHT →</text>
    </g>
  </g>

  <!-- ================= 5. IN LABS ARCADE CARDS GRID ================= -->
  <g transform="translate(24, 552)">
    <text x="0" y="18" font-size="14" font-weight="900" fill="#ffffff" letter-spacing="1">🧪 IN LABS &amp; UPCOMING</text>
    <text x="402" y="18" font-size="11" font-weight="700" fill="#8b95c9" text-anchor="end">7 EXPERIMENTS</text>

    <!-- Card 1: Head & Tail -->
    <g transform="translate(0, 32)">
      <rect x="0" y="0" width="126" height="145" rx="14" fill="#121528" stroke="#252b52" stroke-width="1.5" />
      <circle cx="63" cy="42" r="22" fill="#241b12" stroke="#eab308" stroke-width="1.5" />
      <text x="63" y="47" font-size="14" font-weight="900" fill="#fef08a" text-anchor="middle">H/T</text>
      <text x="63" y="86" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">Head &amp; Tail</text>
      <text x="63" y="102" font-size="9" font-weight="600" fill="#8b95c9" text-anchor="middle">Coin Flip Streak</text>
      <rect x="22" y="114" width="82" height="18" rx="4" fill="#1d223f" />
      <text x="63" y="127" font-size="8" font-weight="800" fill="#fef08a" text-anchor="middle">SOON • 2X DBL</text>
    </g>

    <!-- Card 2: Chicken Cross -->
    <g transform="translate(138, 32)">
      <rect x="0" y="0" width="126" height="145" rx="14" fill="#121528" stroke="#252b52" stroke-width="1.5" />
      <circle cx="63" cy="42" r="22" fill="#2b1418" stroke="#ff3366" stroke-width="1.5" />
      <text x="63" y="48" font-size="18" font-weight="900" fill="#ff3366" text-anchor="middle">🐔</text>
      <text x="63" y="86" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">Chicken Cross</text>
      <text x="63" y="102" font-size="9" font-weight="600" fill="#8b95c9" text-anchor="middle">Lane Survival</text>
      <rect x="22" y="114" width="82" height="18" rx="4" fill="#1d223f" />
      <text x="63" y="127" font-size="8" font-weight="800" fill="#ff3366" text-anchor="middle">SOON • 100X</text>
    </g>

    <!-- Card 3: Basketball Slam -->
    <g transform="translate(276, 32)">
      <rect x="0" y="0" width="126" height="145" rx="14" fill="#121528" stroke="#252b52" stroke-width="1.5" />
      <circle cx="63" cy="42" r="22" fill="#2b1e12" stroke="#f97316" stroke-width="1.5" />
      <text x="63" y="48" font-size="18" font-weight="900" fill="#f97316" text-anchor="middle">🏀</text>
      <text x="63" y="86" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">Hoops Slam</text>
      <text x="63" y="102" font-size="9" font-weight="600" fill="#8b95c9" text-anchor="middle">4 Quarter Spread</text>
      <rect x="22" y="114" width="82" height="18" rx="4" fill="#1d223f" />
      <text x="63" y="127" font-size="8" font-weight="800" fill="#f97316" text-anchor="middle">SOON • 4Q LIVE</text>
    </g>
  </g>

  <!-- ================= 6. FLOATING DOCK BOTTOM NAVIGATION ================= -->
  <g transform="translate(24, 830)">
    <!-- Frosted Glass Dock -->
    <rect x="0" y="0" width="402" height="62" rx="24" fill="#0d1022" stroke="#252c54" stroke-width="1.5" filter="drop-shadow(0 10px 30px rgba(0,0,0,0.8))" />
    
    <!-- Tab 1: Arena (Active) -->
    <g transform="translate(18, 9)">
      <rect x="0" y="0" width="86" height="44" rx="16" fill="#00f0ff" />
      <text x="43" y="27" font-size="12" font-weight="900" fill="#07070f" text-anchor="middle">🎮 ARENA</text>
    </g>
    <!-- Tab 2: Bets -->
    <g transform="translate(118, 9)">
      <text x="38" y="27" font-size="12" font-weight="700" fill="#8b95c9" text-anchor="middle">📋 SLIP</text>
    </g>
    <!-- Tab 3: Leagues -->
    <g transform="translate(208, 9)">
      <text x="42" y="27" font-size="12" font-weight="700" fill="#8b95c9" text-anchor="middle">🏆 RANKS</text>
    </g>
    <!-- Tab 4: Profile -->
    <g transform="translate(306, 9)">
      <text x="42" y="27" font-size="12" font-weight="700" fill="#8b95c9" text-anchor="middle">👤 WALLET</text>
    </g>
  </g>
</svg>
